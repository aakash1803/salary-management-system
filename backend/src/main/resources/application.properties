spring.application.name=salary-management-backend

# SQLite datasource
spring.datasource.url=jdbc:sqlite:./data/salary-management.db?foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# Authentication (JWT)
#
# DEV-ONLY DEFAULTS BELOW. These are placeholder values checked into source control for local
# development convenience only - they are NOT real secrets. Override every one of them via
# environment variables for any shared, staging, or production environment. See
# docs/security-configuration.md for how each value is used and how to generate your own.
#   APP_SECURITY_HR_MANAGER_USERNAME
#   APP_SECURITY_HR_MANAGER_PASSWORD_HASH
#   APP_SECURITY_JWT_SECRET
#   APP_SECURITY_JWT_EXPIRATION_MINUTES (optional, defaults to 60)
app.security.hr-manager.username=hr.manager
app.security.hr-manager.password-hash=$2b$10$XCT6Nlha8rQq8ic94ujiLOnnc.vhRVFPwCG3KnRHbSPBZ52zO7lUG
app.security.jwt.secret=yWEPChi38oJy9wW-aNI1QtDzuNC7-Z1uu8x9q85nkMpMS6kWP7kfx8ZEIjgSwjRO
app.security.jwt.expiration-minutes=60

# Authentication cookie (HttpOnly JWT transport) - see docs/security-configuration.md.
#
# DEV-ONLY DEFAULT BELOW for cookie-secure. A Secure cookie is only ever sent over HTTPS, so
# cookie-secure=false is required for local http://localhost development. Override
# APP_SECURITY_JWT_COOKIE_SECURE=true for any staging/production deployment served over HTTPS.
app.security.jwt.cookie-name=access_token
app.security.jwt.cookie-secure=false

# CORS - the single trusted Angular origin allowed to make credentialed requests to this API.
# Override APP_SECURITY_CORS_ALLOWED_ORIGIN for any non-local deployment.
app.security.cors.allowed-origin=http://localhost:4200
