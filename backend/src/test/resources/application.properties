spring.application.name=salary-management-backend

# Tests use the same SQLite dialect/driver as production, but against a private, in-memory
# SQLite database (shared across the pool via cache=shared) so tests are fast, isolated from any
# real data file, and do not require a migration tool. maximum-pool-size=1 avoids
# "database is locked" errors, since SQLite only allows one writer at a time.
spring.datasource.url=jdbc:sqlite:file::memory:?cache=shared&foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

# Hibernate generates the schema from the entity mappings for each test run (create-drop), since
# there is no migration tool yet. Production currently uses ddl-auto=update (temporary, until a
# migration tool is introduced) - tests intentionally still recreate the schema from scratch
# each run rather than relying on incremental updates, for repeatability.
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop

