@if (isLoginPage()) {
  <div class="auth-wrapper">
    <router-outlet />
  </div>
} @else {
  <div class="app-layout">
    @if (isMobileSidebarOpen()) {
      <div class="sidebar-backdrop" (click)="toggleMobileSidebar()" aria-hidden="true"></div>
    }

    <aside class="sidebar" [class.open]="isMobileSidebarOpen()">
      <div class="sidebar-header">
        <div class="brand-logo">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            <line x1="6" y1="12" x2="18" y2="12"></line>
            <line x1="12" y1="6" x2="12" y2="18"></line>
          </svg>
        </div>
        <span class="brand-title">Salary Management</span>
      </div>

      <nav class="sidebar-nav">
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          Dashboard
        </a>
        <a routerLink="/employees" routerLinkActive="active" class="nav-item">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          Employees
        </a>
      </nav>

      <div class="sidebar-footer">
        <button type="button" class="logout-btn" title="Logout (Visual indicator only)">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          Logout
        </button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button type="button" class="mobile-toggle" (click)="toggleMobileSidebar()" aria-label="Toggle navigation">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <span class="topbar-title">{{ pageTitle() }}</span>
        </div>

        <div class="topbar-right">
          <div class="user-profile">
            <div class="avatar">HR</div>
            <div class="user-info">
              <span class="user-name">HR Manager</span>
              <span class="user-handle">hr.manager</span>
            </div>
          </div>
        </div>
      </header>

      <main class="content-area">
        <router-outlet />
      </main>
    </div>
  </div>
}
